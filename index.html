<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Budget Calculator</title>
   <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Header with Dark Mode Toggle-->
    <header class="site-header">
        <div class="header-space"></div><!--Empty spacer to help center the logo-->
        <img src="images/FBC.png" alt="Family Budget Calculator Logo" class="logo">
        <button id="darkModeToggle" class="icon-btn" onclick="toggleDarkMode()">🌙</button>
    </header>

    <div class="container">
        <h1>Family Budget Calculator</h1>
        <h2>Monthly Income</h2>
        <label for="income"></label>
        <input type="number" id="income" placeholder="Enter income">

        <h3>Monthly Expenses</h3>

            <label for="rent">Rent</label>
            <input type="number" id="rent" placeholder="Enter rent">

            <label for="food">Food</label>
            <input type="number" id="food" placeholder="Enter food">

            <label for="transport">Transport</label>
            <input type="number" id="transport" placeholder="Enter transport">

            <label for="insurance">Insurance</label>
            <input type="number" id="insurance" placeholder="Enter insurance">

            <label for="utilities">Utilities</label>
            <input type="number" id="utilities" placeholder="Enter utilities">

            <label for="clothings">Clothings</label>
            <input type="number" id="clothings" placeholder="Enter clothings">

            <label for="entertainments">Entertainments</label>
            <input type="number" id="entertainments" placeholder="Enter entertainments">

            <label for="childcare">Childcare</label>
            <input type="number" id="childcare" placeholder="Enter childcare">

            <label for="misc">Miscellaneous</label>
            <input type="number" id="misc" placeholder="Enter misc">

            <label for="savings">Savings</label>
            <input type="number" id="savings" placeholder="Enter savings">

            <label for="investment">Investment</label>
            <input type="number" id="investment" placeholder="Enter investment">
         
    <div  class="button-container"> 

            <button onclick="calculateBudget()">Calculate</button>
            <button id="clearBtn">Clear All</button>
            <button id="exportBtn">Export Budget</button>
            <button id="saveBtn">Save Report</button>
    </div>
    <div id="toast" class="toast">Budget report saved successfully!</div>
                <h4 id="result"></h4>
                <p id="total"></p>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="script.js"></script>

</body>

</html>
